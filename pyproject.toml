[build-system]
requires = ["setuptools>=80.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-tracker"
description = "A simple Python based habit tracking app"
requires-python = ">=3.13.2"
dependencies = ["pandas","streamlit","requests"]
readme = "README.md"

dynamic = ["version"]

[tool.poetry]
package-mode = false
version = "0.0.0"


[dependency-groups]
dev = ["pytest"]